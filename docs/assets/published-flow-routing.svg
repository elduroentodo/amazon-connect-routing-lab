<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Published Amazon Connect routing flow</title>
  <desc id="desc">Welcome prompt invokes a Lambda lookup. Urgent priority goes to escalation; normal, missing, or error outcomes go to a keypad menu and then to the relevant queue.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#475569"/></marker>
    <style>.h{font:700 24px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#0f172a}.s{font:500 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#334155}.k{font:700 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#475569}.box{stroke:#cbd5e1;stroke-width:2;rx:16;filter:url(#shadow)}.arrow{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}.note{font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#475569}</style>
  </defs>
  <rect width="1200" height="660" fill="url(#bg)"/>
  <text x="60" y="67" class="h">Published Amazon Connect sandbox flow</text>
  <text x="60" y="96" class="s">Redacted architecture view — no phone number, customer data, or credentials</text>

  <rect x="60" y="210" width="180" height="110" class="box" fill="#ffffff"/>
  <text x="150" y="252" text-anchor="middle" class="k">INBOUND FLOW</text>
  <text x="150" y="284" text-anchor="middle" class="h" font-size="20">Welcome prompt</text>

  <rect x="315" y="210" width="205" height="110" class="box" fill="#eef2ff" stroke="#818cf8"/>
  <text x="417" y="252" text-anchor="middle" class="k">SYNCHRONOUS LOOKUP</text>
  <text x="417" y="284" text-anchor="middle" class="h" font-size="20">Lambda</text>
  <text x="417" y="308" text-anchor="middle" class="s">fictional context only</text>

  <rect x="595" y="210" width="225" height="110" class="box" fill="#ecfdf5" stroke="#34d399"/>
  <text x="707" y="248" text-anchor="middle" class="k">CONTACT ATTRIBUTE CHECK</text>
  <text x="707" y="280" text-anchor="middle" class="h" font-size="20">External.priority</text>
  <text x="707" y="307" text-anchor="middle" class="s">equals “urgent”?</text>

  <rect x="925" y="110" width="215" height="108" class="box" fill="#fff7ed" stroke="#fb923c"/>
  <text x="1032" y="151" text-anchor="middle" class="k">YES — URGENT</text>
  <text x="1032" y="183" text-anchor="middle" class="h" font-size="20">Escalations queue</text>

  <rect x="915" y="390" width="240" height="130" class="box" fill="#ffffff"/>
  <text x="1035" y="431" text-anchor="middle" class="k">NO MATCH OR LAMBDA ERROR</text>
  <text x="1035" y="463" text-anchor="middle" class="h" font-size="20">Keypad menu</text>
  <text x="1035" y="491" text-anchor="middle" class="s">1 Spanish · 2 urgent · 3 general</text>

  <path d="M240 265 H315" class="arrow"/>
  <path d="M520 265 H595" class="arrow"/>
  <path d="M820 244 C870 244 875 164 925 164" class="arrow"/>
  <path d="M820 288 C870 288 870 455 915 455" class="arrow"/>
  <path d="M520 298 C715 298 720 500 915 500" class="arrow"/>
  <text x="842" y="221" class="note">= urgent</text>
  <text x="778" y="365" class="note">No Match</text>
  <text x="603" y="492" class="note">Lambda Error → menu</text>

  <rect x="62" y="568" width="1075" height="50" rx="12" fill="#e2e8f0"/>
  <text x="600" y="600" text-anchor="middle" class="s">Design principle: a lookup improves priority handling, but a missing value never prevents access to support.</text>
</svg>
