<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">Amazon Connect Routing Lab implementation process</title>
  <desc id="desc">Six steps show queues, routing profile, Lambda, permission, contact flow, and tests before publication.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#64748b"/></marker><style>.h{font:700 25px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#0f172a}.n{font:700 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#312e81}.b{font:600 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#1e293b}.s{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#475569}.a{stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="450" fill="#ffffff"/>
  <text x="60" y="67" class="h">Implementation process</text>
  <text x="60" y="96" class="s">The repository documents both the AWS configuration and the reproducible local checks.</text>
  <line x1="135" y1="240" x2="1065" y2="240" class="a"/>
  <g><circle cx="120" cy="240" r="43" fill="#e0e7ff" stroke="#818cf8" stroke-width="3"/><text x="120" y="247" text-anchor="middle" class="n">1</text><text x="120" y="320" text-anchor="middle" class="b">Queues</text><text x="120" y="344" text-anchor="middle" class="s">types of work</text></g>
  <g><circle cx="310" cy="240" r="43" fill="#ede9fe" stroke="#a78bfa" stroke-width="3"/><text x="310" y="247" text-anchor="middle" class="n">2</text><text x="310" y="320" text-anchor="middle" class="b">Routing profile</text><text x="310" y="344" text-anchor="middle" class="s">priority order</text></g>
  <g><circle cx="500" cy="240" r="43" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/><text x="500" y="247" text-anchor="middle" class="n">3</text><text x="500" y="320" text-anchor="middle" class="b">Lambda</text><text x="500" y="344" text-anchor="middle" class="s">fictional lookup</text></g>
  <g><circle cx="690" cy="240" r="43" fill="#ecfccb" stroke="#84cc16" stroke-width="3"/><text x="690" y="247" text-anchor="middle" class="n">4</text><text x="690" y="320" text-anchor="middle" class="b">Permission</text><text x="690" y="344" text-anchor="middle" class="s">Connect may invoke</text></g>
  <g><circle cx="880" cy="240" r="43" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/><text x="880" y="247" text-anchor="middle" class="n">5</text><text x="880" y="320" text-anchor="middle" class="b">Contact flow</text><text x="880" y="344" text-anchor="middle" class="s">rule + fallback</text></g>
  <g><circle cx="1070" cy="240" r="43" fill="#ffedd5" stroke="#f97316" stroke-width="3"/><text x="1070" y="247" text-anchor="middle" class="n">6</text><text x="1070" y="320" text-anchor="middle" class="b">Validate &amp; publish</text><text x="1070" y="344" text-anchor="middle" class="s">sandbox only</text></g>
</svg>
