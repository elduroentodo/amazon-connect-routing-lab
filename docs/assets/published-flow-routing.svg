<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Published bilingual Amazon Connect sandbox routing flow</title>
  <desc id="desc">Welcome and language selection lead to English or Spanish Lex voice intent. Routine intent chooses a language queue; technical intent invokes Lambda and checks priority. Errors and normal priority use the keypad fallback. All queues share one transfer block. No phone number is attached.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#475569"/></marker>
    <style>
      .title{font:700 25px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#0f172a}
      .body{font:500 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#334155}
      .label{font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#475569}
      .box{stroke:#cbd5e1;stroke-width:2;rx:14}
      .line{fill:none;stroke:#475569;stroke-width:2.7;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#64748b;stroke-width:2.3;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="42" y="52" class="title">Bilingual voice intake + deterministic routing</text>
  <text x="42" y="80" class="body">Published sandbox configuration · redacted architecture view · no number or customer data</text>

  <rect x="42" y="175" width="142" height="86" class="box" fill="#ffffff"/>
  <text x="113" y="208" text-anchor="middle" class="label">CONNECT</text>
  <text x="113" y="237" text-anchor="middle" class="body">Welcome</text>

  <rect x="229" y="175" width="190" height="86" class="box" fill="#ffffff"/>
  <text x="324" y="208" text-anchor="middle" class="label">LANGUAGE CHOICE</text>
  <text x="324" y="237" text-anchor="middle" class="body">1 English · 2 Español</text>
  <path d="M184 218 H229" class="line"/>

  <rect x="474" y="112" width="246" height="96" class="box" fill="#eef2ff" stroke="#818cf8"/>
  <text x="597" y="145" text-anchor="middle" class="label">en-US → LEX V2</text>
  <text x="597" y="177" text-anchor="middle" class="body">Recognize English intent</text>
  <rect x="474" y="250" width="246" height="96" class="box" fill="#eef2ff" stroke="#818cf8"/>
  <text x="597" y="283" text-anchor="middle" class="label">es-419 → LEX V2</text>
  <text x="597" y="315" text-anchor="middle" class="body">Recognize Spanish intent</text>
  <path d="M419 200 C444 200 444 160 474 160" class="line"/>
  <path d="M419 236 C445 236 444 298 474 298" class="line"/>

  <rect x="790" y="106" width="338" height="112" class="box" fill="#ecfdf5" stroke="#34d399"/>
  <text x="959" y="140" text-anchor="middle" class="label">ROUTINE INTENT</text>
  <text x="959" y="170" text-anchor="middle" class="body">Billing · onboarding · speak to agent</text>
  <text x="959" y="194" text-anchor="middle" class="body">English → general · Spanish → Spanish queue</text>
  <path d="M720 157 H790" class="line"/>
  <path d="M720 288 C759 288 750 202 790 202" class="line"/>

  <rect x="790" y="280" width="338" height="114" class="box" fill="#fff7ed" stroke="#fb923c"/>
  <text x="959" y="313" text-anchor="middle" class="label">TECHNICAL INTENT</text>
  <text x="959" y="342" text-anchor="middle" class="body">Lambda lookup → External.priority</text>
  <text x="959" y="366" text-anchor="middle" class="body">urgent → escalations queue</text>
  <path d="M720 183 C756 183 750 317 790 317" class="line"/>
  <path d="M720 309 H790" class="line"/>

  <rect x="485" y="476" width="352" height="112" class="box" fill="#ffffff"/>
  <text x="661" y="509" text-anchor="middle" class="label">SAFE KEYPAD FALLBACK</text>
  <text x="661" y="540" text-anchor="middle" class="body">1 Spanish · 2 urgent · 3 general</text>
  <text x="661" y="565" text-anchor="middle" class="body">Lex error/no match · Lambda error/normal</text>
  <path d="M324 261 C324 450 437 532 485 532" class="dash"/>
  <path d="M597 346 V476" class="dash"/>
  <path d="M790 356 C730 356 760 455 720 476" class="dash"/>

  <rect x="928" y="500" width="200" height="87" class="box" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="1028" y="533" text-anchor="middle" class="label">ONE SHARED STEP</text>
  <text x="1028" y="560" text-anchor="middle" class="body">Transfer to queue</text>
  <path d="M837 544 H928" class="line"/>
  <path d="M1054 218 V280" class="line"/>
  <path d="M1128 343 C1170 343 1170 544 1128 544" class="line"/>

  <rect x="42" y="632" width="1086" height="50" rx="12" fill="#e2e8f0"/>
  <text x="585" y="663" text-anchor="middle" class="body">A recognized topic helps route work; trusted context decides urgency; fallback keeps support reachable.</text>
</svg>
