<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Lambda contract used by Amazon Connect</title>
  <desc id="desc">Amazon Connect invokes the Lambda with fictional input parameters and receives a flat string map. The published flow currently sends empty parameters and gets a normal safe fallback.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#475569"/></marker><style>.h{font:700 25px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#0f172a}.k{font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#475569}.m{font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#0f172a}.s{font:500 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#334155}.a{stroke:#475569;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="60" y="65" class="h">Lambda input and output contract</text>
  <text x="60" y="94" class="s">Flat string values are intentionally easy for a contact flow to validate and branch on.</text>
  <rect x="60" y="145" width="340" height="305" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="90" y="190" class="k">AMAZON CONNECT INVOCATION</text>
  <text x="90" y="230" class="m">Details.Parameters</text>
  <text x="90" y="270" class="m">customerId: CUST-100</text>
  <text x="90" y="305" class="m">language: es</text>
  <text x="90" y="340" class="m">issueType: technical</text>
  <text x="90" y="400" class="s">Published sandbox: parameters are empty,</text>
  <text x="90" y="423" class="s">so the safe fallback is returned.</text>
  <rect x="480" y="190" width="235" height="200" rx="18" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
  <text x="598" y="244" text-anchor="middle" class="k">NODE.JS LAMBDA</text>
  <text x="598" y="282" text-anchor="middle" class="m">priority rule</text>
  <text x="598" y="325" text-anchor="middle" class="s">fictional profiles only</text>
  <rect x="795" y="145" width="345" height="305" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="825" y="190" class="k">STRING MAP RESPONSE</text>
  <text x="825" y="230" class="m">customerFound: "false"</text>
  <text x="825" y="265" class="m">plan: "unknown"</text>
  <text x="825" y="300" class="m">openIncident: "false"</text>
  <text x="825" y="335" class="m">issueType: "onboarding"</text>
  <text x="825" y="370" class="m">priority: "normal"</text>
  <text x="825" y="415" class="s">Flow checks External.priority.</text>
  <path d="M400 290 H480" class="a"/><path d="M715 290 H795" class="a"/>
  <rect x="60" y="492" width="1080" height="35" rx="10" fill="#e2e8f0"/><text x="600" y="516" text-anchor="middle" class="s">No secrets are required by this sample. The in-code profiles are fictional and are not a production customer store.</text>
</svg>
